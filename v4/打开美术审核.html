<script>
let active="all";const cards=[...document.querySelectorAll(".card")],search=document.querySelector("#search");
function filter(){const q=search.value.toLowerCase();cards.forEach(c=>c.hidden=!(active==="all"||c.dataset.kind===active)||!c.dataset.name.toLowerCase().includes(q))}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{active=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));filter()});
search.oninput=filter;const dialog=document.querySelector("#viewer");cards.forEach(c=>c.onclick=()=>{document.querySelector("#large").src=c.dataset.src;document.querySelector("#large").alt=c.dataset.name;document.querySelector("#caption").textContent=c.dataset.name;dialog.showModal()});document.querySelector("#close").onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};
</script></html>
