<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>噗噗总动员｜美术审核</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px 18px; color: #442b22; background: radial-gradient(circle at 20% 10%, #fff4d9 0 15%, transparent 38%), linear-gradient(135deg, #ffe4af, #f6b774); }
    main { width: min(760px, 100%); padding: clamp(28px, 6vw, 52px); border: 3px solid #8a5637; border-radius: 32px; background: rgba(255, 252, 242, .94); box-shadow: 0 18px 0 rgba(103, 58, 35, .18), 0 28px 54px rgba(103, 58, 35, .24); }
    .eyebrow { margin: 0 0 8px; color: #a35d30; font-weight: 800; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 52px); line-height: 1.15; }
    .intro { max-width: 36em; margin: 18px 0 30px; color: #745444; font-size: 17px; line-height: 1.65; }
    .cards { display: grid; gap: 16px; }
    a.card { display: block; padding: 22px; border: 2px solid #d6a172; border-radius: 20px; color: inherit; text-decoration: none; background: #fff; transition: transform .15s ease, box-shadow .15s ease; }
    a.card:hover, a.card:focus-visible { transform: translateY(-3px); box-shadow: 0 8px 0 #e7bf8c; outline: 3px solid #6ea66b; outline-offset: 3px; }
    .tag { display: inline-block; padding: 4px 10px; border-radius: 999px; color: #fff; background: #77a96f; font-size: 13px; font-weight: 800; }
    .tag.old { background: #ad7e53; }
    h2 { margin: 11px 0 8px; font-size: 24px; }
    .card p { margin: 0; color: #725447; line-height: 1.55; }
    footer { margin-top: 26px; color: #8c6d5b; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">PUPU MOBILIZATION</p>
    <h1>噗噗总动员<br>美术审核</h1>
    <p class="intro">可直接打开以下版本查看场景、角色动作、招式图标与特效美术。本网页只包含美术审核资料。</p>
    <section class="cards" aria-label="审核版本">
      <a class="card" href="v7/">
        <span class="tag">当前版本</span>
        <h2>V7｜UI、长局战斗与循环地图</h2>
        <p>28 张实际游戏截图：分层封面、中英文界面、空栏开局、升级与结算、C01–C05 循环地面。</p>
      </a>
      <a class="card" href="v5/打开美术审核.html">
        <span class="tag old">美术资源版本</span>
        <h2>V5｜场景、动作与全招式特效</h2>
        <p>查看 C01–C05 场景、角色/Boss 动作、主动招式、辅助增益与特效资源。</p>
      </a>
      <a class="card" href="v4/打开美术审核.html">
        <span class="tag old">早期版本</span>
        <h2>V4｜完整美术审核包</h2>
        <p>查看此前的角色、界面、图标与基础特效美术。</p>
      </a>
    </section>
    <footer>审核页不含 Unity 工程、可玩游戏、安装包或视频文件。</footer>
  </main>
</body>
</html>
