categories.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>{category=c;render()};tabs.append(b)});
function render(){
 [...tabs.children].forEach(b=>{b.classList.toggle('active',b.textContent===category);b.setAttribute('aria-pressed',b.textContent===category)});
 $('cycle').classList.toggle('hidden',category!=='30关循环');$('cards').classList.toggle('hidden',category==='30关循环');
 if(category==='30关循环'){$('count').textContent='五种环境 × 六轮 · 第 30 关结束';renderCycle();return}
 let q=$('search').value.trim().toLowerCase();
 let shown=assets.filter(a=>(category==='全部'||a.category===category)&&(a.id+' '+a.name+' '+a.note).toLowerCase().includes(q));
 $('count').textContent=category+' · '+shown.length+' 项'; $('cards').classList.toggle('portrait',['场景','界面'].includes(category));$('cards').replaceChildren();
 shown.forEach(a=>{let article=document.createElement('article');article.className='card';let b=document.createElement('button');b.setAttribute('aria-label','查看 '+a.id+' '+a.name);let img=document.createElement('img');img.src=a.thumb;img.alt=a.name;img.loading='lazy';b.append(img);b.onclick=()=>openAsset(a,b);let d=document.createElement('div');d.className='cardbody';let tag=document.createElement('div');tag.className='tag';tag.textContent=a.id+' / '+a.category;let h=document.createElement('h2');h.textContent=a.name;let p=document.createElement('p');p.textContent=a.note||'完整场景背景 · 待审核';let link=document.createElement('a');link.href=a.path;link.target='_blank';link.rel='noopener';link.textContent='原图 '+a.width+' × '+a.height;d.append(tag,h,p,link);article.append(b,d);$('cards').append(article)});
}
function renderCycle(){
 const box=$('cycle');box.replaceChildren();let notice=document.createElement('p');notice.className='notebox';notice.textContent='第 6、11、16、21、26 关都回到厨房。怪物逐轮加强，精英逐步加入。下表记录环境与 Boss 循环；精英节奏为候选，数值尚未实测。';box.append(notice);
 let table=document.createElement('table');for(let row=0;row<6;row++){let tr=document.createElement('tr');for(let col=0;col<5;col++){let l=levels[row*5+col],a=assets.find(a=>a.id===l.scene_id),td=document.createElement('td'),img=document.createElement('img'),strong=document.createElement('strong'),small=document.createElement('small');img.src=a.thumb;img.alt=l.scene;strong.textContent='第 '+l.level+' 关 · '+l.scene;small.textContent=l.boss+' / '+l.elite_direction;td.append(img,strong,small);tr.append(td)}table.append(tr)}box.append(table)
}
function stop(){if(timer)clearInterval(timer);timer=null;$('play').textContent='顺序翻页'}
function openAsset(a,trigger){selected=a;lastFocus=trigger;frameIndex=0;frameMode=false;stop();$('modalTitle').textContent=a.id+' · '+a.name;$('whole').src=a.path;$('whole').alt=a.name;$('frameImage').src=a.path;$('frameImage').alt=a.name+' 关键帧';$('original').href=a.path;$('detailnote').textContent=a.note+(a.grid?' 逐格查看仅展示设计稿的动作顺序；角色位置、比例与中间帧尚待动画制作统一。':'');['frameBtn','prev','next','play'].forEach(id=>$(id).classList.toggle('hidden',!a.grid));updateFrame();$('detail').showModal()}
function updateFrame(){
 $('whole').classList.toggle('hidden',frameMode);$('frame').classList.toggle('hidden',!frameMode);
 $('wholeBtn').classList.toggle('active',!frameMode);$('frameBtn').classList.toggle('active',frameMode);
 if(selected?.grid){let [cols,rows]=selected.grid;let x=frameIndex%cols,y=Math.floor(frameIndex/cols);$('frame').style.aspectRatio=(selected.width/cols)/(selected.height/rows);$('frame').style.width='min(630px,100%,'+(58*(selected.width/cols)/(selected.height/rows))+'vh)';Object.assign($('frameImage').style,{width:cols*100+'%',height:rows*100+'%',left:-x*100+'%',top:-y*100+'%'});$('frameLabel').textContent=frameMode?'画格 '+(frameIndex+1)+' / '+(cols*rows)+' · 非最终动画':''}else $('frameLabel').textContent='';
}
$('wholeBtn').onclick=()=>{stop();frameMode=false;updateFrame()};
$('frameBtn').onclick=()=>{stop();frameMode=true;updateFrame()};
function step(n){frameMode=true;const count=selected.grid[0]*selected.grid[1];frameIndex=(frameIndex+n+count)%count;updateFrame()}
$('prev').onclick=()=>{stop();step(-1)};$('next').onclick=()=>{stop();step(1)};
$('play').onclick=()=>{if(timer){stop();return}frameMode=true;updateFrame();$('play').textContent='暂停翻页';timer=setInterval(()=>step(1),850)};
$('close').onclick=()=>$('detail').close();$('detail').addEventListener('close',()=>{stop();lastFocus?.focus()});
$('detail').addEventListener('click',e=>{if(e.target===$('detail')){let r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail').close()}});
$('search').addEventListener('input',render);document.addEventListener('keydown',e=>{if($('detail').open&&selected?.grid&&e.key==='ArrowRight'){stop();step(1)}if($('detail').open&&selected?.grid&&e.key==='ArrowLeft'){stop();step(-1)}});
render();
</script></body></html>
